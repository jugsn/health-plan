# 每日提醒 → 推送到微信(Server酱)
# 时间为 UTC,北京时间 = UTC+8:
#   30 23 * * *  = 北京时间 07:30  称重提醒
#   30 14 * * *  = 北京时间 22:30  睡前降档提醒
#   0 13 * * 0   = 北京时间 周日 21:00  周复盘提醒

name: 每日提醒

on:
  schedule:
    - cron: '30 23 * * *'
    - cron: '30 14 * * *'
    - cron: '0 13 * * 0'
  workflow_dispatch:

permissions:
  contents: write

env:
  # ↓↓↓ 改成你自己的网址(仓库 Settings → Pages 里能看到),不改也不影响提醒文字
  SITE_URL: 'https://你的用户名.github.io/你的仓库名/'

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 早安 · 称重记录
        if: github.event.schedule == '30 23 * * *'
        env:
          KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          [ -z "$KEY" ] && { echo "未配置 SERVERCHAN_KEY,跳过"; exit 0; }
          LINK=""; case "$SITE_URL" in http*) LINK="打开记录:$SITE_URL";; esac
          curl -sS -m 25 -X POST "https://sctapi.ftqq.com/${KEY}.send" \
            --data-urlencode "title=🌅 07:30 称重时间" \
            --data-urlencode "desp=起床 → 上厕所 → 晨起称重 → 打开健康计划填一下(2 分钟)。$LINK"

      - name: 晚安 · 睡前降档
        if: github.event.schedule == '30 14 * * *'
        env:
          KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          [ -z "$KEY" ] && { echo "未配置 SERVERCHAN_KEY,跳过"; exit 0; }
          LINK=""; case "$SITE_URL" in http*) LINK="打开记录:$SITE_URL";; esac
          curl -sS -m 25 -X POST "https://sctapi.ftqq.com/${KEY}.send" \
            --data-urlencode "title=🌙 22:30 睡前降档" \
            --data-urlencode "desp=手机充电、灯光调暗、拿纸质书。今天有没有主动拒绝过一次? $LINK"

      - name: 周复盘
        if: github.event.schedule == '0 13 * * 0'
        env:
          KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          [ -z "$KEY" ] && { echo "未配置 SERVERCHAN_KEY,跳过"; exit 0; }
          LINK=""; case "$SITE_URL" in http*) LINK="打开记录:$SITE_URL";; esac
          curl -sS -m 25 -X POST "https://sctapi.ftqq.com/${KEY}.send" \
            --data-urlencode "title=🔁 周日 21:00 周复盘" \
            --data-urlencode "desp=花 15 分钟:看 7 天平均体重、平均睡眠、执行率,回答三问——什么有效?什么没效?下周只改一个什么?$LINK"

      # GitHub 会自动停用「60 天无活动」仓库的定时任务,每天提交一次空提交保持活跃
      - name: 保持仓库活跃
        run: |
          git config user.name "health-plan-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflow alive" || true
          git push || true
