# 微信提醒 → 已迁移到 cron-job.org
#
# 为什么不用 GitHub Actions 定时:
#   GitHub 的 schedule 触发经常延迟数小时(实测 07:30 的提醒拖到 11:04 才发),
#   而且不准点、还会和 cron-job.org 重复发送,白耗 Server酱 每天 5 条的额度。
#
# 现在的定时提醒由 cron-job.org 直接调 Server酱,实测误差 2 秒:
#   07:30  称重提醒      (job 8788669)
#   22:30  睡前降档      (job 8788673)
#   周日 21:00 周复盘    (job 8788670)   时区均为 Asia/Shanghai
#
# 本工作流保留为「手动备用通道」:cron-job.org 万一挂了,可在 Actions 页
# → 每日提醒 → Run workflow 手动补发一条。

name: 每日提醒(手动备用)

on:
  workflow_dispatch:
    inputs:
      which:
        description: '要发送哪条提醒'
        required: true
        default: 'weigh'
        type: choice
        options:
          - weigh
          - sleep
          - review

permissions:
  contents: read

env:
  SITE_URL: 'https://jugsn.github.io/health-plan/'

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 早安 · 称重记录
        if: inputs.which == 'weigh'
        env:
          KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          [ -z "$KEY" ] && { echo "未配置 SERVERCHAN_KEY,跳过"; exit 0; }
          curl -sS -m 25 -X POST "https://sctapi.ftqq.com/${KEY}.send" \
            --data-urlencode "title=🌅 07:30 称重时间" \
            --data-urlencode "desp=起床 → 上厕所 → 晨起称重 → 打开健康计划填一下(2 分钟)。打开记录:$SITE_URL"

      - name: 晚安 · 睡前降档
        if: inputs.which == 'sleep'
        env:
          KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          [ -z "$KEY" ] && { echo "未配置 SERVERCHAN_KEY,跳过"; exit 0; }
          curl -sS -m 25 -X POST "https://sctapi.ftqq.com/${KEY}.send" \
            --data-urlencode "title=🌙 22:30 睡前降档" \
            --data-urlencode "desp=手机充电、灯光调暗、拿纸质书。今天有没有主动拒绝过一次? 打开记录:$SITE_URL"

      - name: 周复盘
        if: inputs.which == 'review'
        env:
          KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          [ -z "$KEY" ] && { echo "未配置 SERVERCHAN_KEY,跳过"; exit 0; }
          curl -sS -m 25 -X POST "https://sctapi.ftqq.com/${KEY}.send" \
            --data-urlencode "title=🔁 周日 21:00 周复盘" \
            --data-urlencode "desp=花 15 分钟:看 7 天平均体重、平均睡眠、执行率,回答三问——什么有效?什么没效?下周只改一个什么? 打开记录:$SITE_URL"
